<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест исправленного алгоритма</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }
        
        .container {
            max-width: 1800px;
            margin: 0 auto;
        }
        
        h1 {
            color: #4ec9b0;
            margin-bottom: 20px;
        }
        
        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .panel {
            background: #252526;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            padding: 15px;
        }
        
        .panel h2 {
            color: #569cd6;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .canvas-wrapper {
            background: #2a2a2a;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 500px;
        }
        
        .stats {
            margin-top: 15px;
            padding: 15px;
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: 200px 1fr;
            padding: 5px 0;
            border-bottom: 1px solid #3c3c3c;
        }
        
        .stats-label {
            color: #9cdcfe;
        }
        
        .stats-value {
            color: #ce9178;
        }
        
        .test-result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .test-result.pass {
            background: #1e3a1e;
            border: 1px solid #4ec9b0;
            color: #4ec9b0;
        }
        
        .test-result.fail {
            background: #3a1e1e;
            border: 1px solid #f48771;
            color: #f48771;
        }
        
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        button:hover {
            background: #1177bb;
        }
        
        .log {
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
            font-size: 11px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .log-entry {
            margin-bottom: 3px;
            padding: 2px 0;
        }
        
        .log-entry.pass { color: #4ec9b0; }
        .log-entry.fail { color: #f48771; }
        .log-entry.info { color: #9cdcfe; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 Тест исправленного алгоритма VennGrid.js</h1>
        
        <div style="margin-bottom: 20px;">
            <button onclick="runTest1()">Тест 1: Простой (2 множества)</button>
            <button onclick="runTest2()">Тест 2: Полный (3 множества)</button>
            <button onclick="runTest3()">Тест 3: С подобластями</button>
            <button onclick="runTest4()">Тест 4: Сложный</button>
            <button onclick="clearLog()">Очистить лог</button>
        </div>
        
        <div class="comparison">
            <!-- Левая панель: Ожидаемые значения -->
            <div class="panel">
                <h2>📋 Ожидаемые значения (по алгоритму Godot)</h2>
                <div id="expectedValues" class="stats">
                    <p style="color: #666;">Запустите тест</p>
                </div>
            </div>
            
            <!-- Правая панель: Фактические значения -->
            <div class="panel">
                <h2>📊 Фактические значения (VennGrid.js)</h2>
                <div id="actualValues" class="stats">
                    <p style="color: #666;">Запустите тест</p>
                </div>
            </div>
        </div>
        
        <!-- Canvas для визуализации -->
        <div class="panel">
            <h2>🎨 Визуализация</h2>
            <div class="canvas-wrapper">
                <canvas id="testCanvas"></canvas>
            </div>
            <div id="testResult" class="test-result" style="display: none;"></div>
        </div>
        
        <!-- Лог -->
        <div class="panel">
            <h2>📝 Лог выполнения</h2>
            <div id="testLog" class="log"></div>
        </div>
    </div>
    
    <script src="../src/venn-grid.js"></script>
    <script src="../test/test-data.js"></script>
    
    <script>
        let venn;
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('testLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }
        
        function clearLog() {
            document.getElementById('testLog').innerHTML = '';
        }
        
        function showExpected(expected) {
            const html = Object.entries(expected).map(([key, value]) => {
                return `<div class="stats-row">
                    <div class="stats-label">${key}:</div>
                    <div class="stats-value">${JSON.stringify(value)}</div>
                </div>`;
            }).join('');
            document.getElementById('expectedValues').innerHTML = html;
        }
        
        function showActual(actual) {
            const html = Object.entries(actual).map(([key, value]) => {
                return `<div class="stats-row">
                    <div class="stats-label">${key}:</div>
                    <div class="stats-value">${JSON.stringify(value)}</div>
                </div>`;
            }).join('');
            document.getElementById('actualValues').innerHTML = html;
        }
        
        function compareResults(expected, actual) {
            const resultDiv = document.getElementById('testResult');
            resultDiv.style.display = 'block';
            
            let allMatch = true;
            const diffs = [];
            
            for (const key in expected) {
                if (expected[key] !== actual[key]) {
                    allMatch = false;
                    diffs.push(`${key}: ожидалось ${expected[key]}, получено ${actual[key]}`);
                    log(`РАСХОЖДЕНИЕ: ${key}: ожидалось ${expected[key]}, получено ${actual[key]}`, 'fail');
                } else {
                    log(`✓ ${key}: ${actual[key]}`, 'pass');
                }
            }
            
            if (allMatch) {
                resultDiv.className = 'test-result pass';
                resultDiv.innerHTML = '✅ ТЕСТ ПРОЙДЕН! Все значения совпадают с алгоритмом Godot.';
            } else {
                resultDiv.className = 'test-result fail';
                resultDiv.innerHTML = `❌ ТЕСТ ПРОВАЛЕН!<br><br>${diffs.join('<br>')}`;
            }
            
            return allMatch;
        }
        
        // Функция расчета ожидаемых значений по алгоритму Godot
        function calculateExpectedGodot(sorted, subsorted) {
            const n1a = subsorted.set1.a.length;
            const n1b = subsorted.set1.b.length;
            const n1c = subsorted.set1.c.length;
            const n2a = subsorted.set2.a.length;
            const n2b = subsorted.set2.b.length;
            const n2c = subsorted.set2.c.length;
            const n3a = subsorted.set3.a.length;
            const n3b = subsorted.set3.b.length;
            const n3c = subsorted.set3.c.length;
            
            let n123 = sorted.intersection123.length;
            let n12 = sorted.intersection12.length + n123;
            let n13 = sorted.intersection13.length + n123;
            let n23 = sorted.intersection23.length + n123;
            
            const n1 = sorted.set1.length + n12 + n13 + n1a + n1b + n1c;
            const n2 = sorted.set2.length + n12 + n23 + n2a + n2b + n2c;
            const n3 = sorted.set3.length + n13 + n23 + n3a + n3b + n3c;
            
            const h1 = Math.ceil(Math.sqrt(n1) / 1.3);
            const h2 = Math.ceil(Math.sqrt(n2) / 1.3);
            const l1 = Math.ceil(n1 / h1);
            const l2 = Math.ceil(n2 / h2);
            
            const h12 = Math.min(h1, h2);
            let l12 = Math.ceil(n12 / h12);
            let l123 = l12;
            let h123 = Math.ceil(n123 / l123);
            
            n13 = n13 - n123;
            n23 = n23 - n123;
            n123 = (l123 * h123 > n123) ? l123 * h123 : n123;
            
            let l13, h13, l23, h23, l3, h3;
            
            if (n123 > 0) {
                l13 = Math.ceil(n13 / h123);
                h13 = h123;
                l23 = Math.ceil(n23 / h123);
                h23 = h123;
                l3 = l13 + l23 + l123;
                h3 = Math.ceil((n13 + n23 + n123) / l3);
            } else {
                l13 = Math.ceil(n13 / h12);
                h13 = h12;
                l23 = Math.ceil(n23 / h12);
                h23 = h12;
                l3 = l13 + l23 + l12;
                h3 = Math.ceil((n3 + n12) / l3);
                if (h3 === h12 && n3 - n13 - n23 > 0) {
                    h3 += 1;
                }
            }
            
            const width = n123 > 0 ? l1 + l2 - l123 : l1 + l2 - l12;
            const height = n123 > 0 ? h1 + h3 - h123 : h1 + h3 - h12;
            
            if (h12 === 0 || l12 === 0) { h12 = 0; l12 = 0; }
            if (h13 === 0 || l13 === 0) { h13 = 0; l13 = 0; }
            if (h23 === 0 || l23 === 0) { h23 = 0; l23 = 0; }
            if (h123 === 0 || l123 === 0) { h123 = 0; l123 = 0; }
            
            return {
                width, height,
                l1, l2, l3, h1, h2, h3,
                l12, l13, l23, l123,
                h12, h13, h23, h123,
                n1, n2, n3
            };
        }
        
        function runTest(data, testName) {
            log(`=== Запуск теста: ${testName} ===`, 'info');
            
            if (venn) {
                venn.destroy();
            }
            
            const canvas = document.getElementById('testCanvas');
            venn = new VennGrid(canvas, {
                cellSize: 40,
                onRenderComplete: function() {
                    const stats = venn.getStats();
                    const gridSizes = venn.gridSizes;
                    
                    // Получаем sorted и subsorted из библиотеки
                    const sorted = venn.sorted;
                    const subsorted = venn.subsorted;
                    
                    // Вычисляем ожидаемые значения
                    const expected = calculateExpectedGodot(sorted, subsorted);
                    
                    // Фактические значения
                    const actual = {
                        width: gridSizes.width,
                        height: gridSizes.height,
                        l1: gridSizes.l1,
                        l2: gridSizes.l2,
                        l3: gridSizes.l3,
                        h1: gridSizes.h1,
                        h2: gridSizes.h2,
                        h3: gridSizes.h3,
                        l12: gridSizes.l12,
                        l13: gridSizes.l13,
                        l23: gridSizes.l23,
                        l123: gridSizes.l123,
                        h12: gridSizes.h12,
                        h13: gridSizes.h13,
                        h23: gridSizes.h23,
                        h123: gridSizes.h123,
                        n1: sorted.set1.length,
                        n2: sorted.set2.length,
                        n3: sorted.set3.length
                    };
                    
                    showExpected(expected);
                    showActual(actual);
                    compareResults(expected, actual);
                    
                    log('Тест завершен', 'info');
                }
            });
            
            venn.setData(data);
        }
        
        function runTest1() {
            clearLog();
            runTest(simpleData, 'Простой (2 множества)');
        }
        
        function runTest2() {
            clearLog();
            runTest(testData, 'Полный (3 множества)');
        }
        
        function runTest3() {
            clearLog();
            runTest(subareaDemo, 'С подобластями');
        }
        
        function runTest4() {
            clearLog();
            const complexData = {
                sets: [
                    {id: 'set1', items: Array.from({length: 20}, (_, i) => ({id: i, title: `Item ${i}`}))},
                    {id: 'set2', items: Array.from({length: 15}, (_, i) => ({id: i + 10, title: `Item ${i+10}`}))},
                    {id: 'set3', items: Array.from({length: 18}, (_, i) => ({id: i + 5, title: `Item ${i+5}`}))}
                ]
            };
            runTest(complexData, 'Сложный (много пересечений)');
        }
        
        // Автозапуск первого теста
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(runTest1, 500);
        });
    </script>
</body>
</html>
